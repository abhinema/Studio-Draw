    svg [data-sd-id] > polyline:not(.sd-hit) { stroke-width: 2 !important; }
}

<script type="text/javascript">/* Studio Draw: independent relationship highlighting over the exported document. */
(() => {
    'use strict';
    const svg = document.querySelector('main svg');
    if (!svg) return;
    const focusPolicy = svg.dataset.sdFocusPolicy || 'relations';
    const items = [...svg.querySelectorAll('[data-sd-id]')];
    const byID = new Map(items.map(item => [item.dataset.sdId, item]));
    const edges = items.filter(item => item.dataset.sdKind === 'connector');
    const children = new Map();
    for (const item of items) {
        const parent = item.dataset.sdParent;
        if (byID.has(parent)) {
            if (!children.has(parent)) children.set(parent, []);
            children.get(parent).push(item.dataset.sdId);
        }
    }
    const status = document.getElementById('trace-status');
    const clear = document.getElementById('clear-focus');
    let pinned = null;
    let hovered = null;
    let focused = null;

    function relationships(id) {
        const active = new Set([id]);
        if (focusPolicy === 'self') return active;
        // Container exploration reveals descendants but does not highlight their connections.
        const queue = [id];
        for (let i = 0; i < queue.length; i++) {
            for (const child of children.get(queue[i]) || []) {
                if (!active.has(child)) { active.add(child); queue.push(child); }
            }
        }
        for (const edge of edges) {
            const from = edge.dataset.sdFrom, to = edge.dataset.sdTo;
            if (!byID.has(from) || !byID.has(to)) continue;
            if (edge.dataset.sdId === id || from === id || to === id) {
                active.add(edge.dataset.sdId); active.add(from); active.add(to);
            }
        }
        // Flat SVG groups keep a dim container from reducing an active child's opacity.
        for (const member of [...active]) {
            let parent = byID.get(member)?.dataset.sdParent;
            const seen = new Set();
            while (byID.has(parent) && !seen.has(parent)) {
                seen.add(parent); active.add(parent); parent = byID.get(parent).dataset.sdParent;
            }
        }
        return active;
    }

    function render() {
        const id = pinned || hovered || focused;
        const active = id ? relationships(id) : new Set();
        svg.toggleAttribute('data-tracing', Boolean(id));
        for (const item of items) {
            const key = item.dataset.sdId;
            item.classList.toggle('sd-dim', Boolean(id) && !active.has(key));
            item.classList.toggle('sd-related', Boolean(id) && active.has(key));
            item.classList.toggle('sd-primary', key === id);
            item.setAttribute('aria-pressed', String(key === pinned));
        }
        status.textContent = id
            ? `${pinned ? 'Pinned' : 'Preview'}: ${byID.get(id).dataset.sdLabel} · ${focusPolicy === 'self' ? 'current component' : 'saved connections and hierarchy'}`
            : focusPolicy === 'self' ? 'Full diagram · hover to focus one component.' : 'Full diagram · connections follow saved attachments.';
        clear.hidden = !id;
    }

    function reset() { pinned = hovered = focused = null; render(); }
    function pin(id) { pinned = pinned === id ? null : id; hovered = focused = null; render(); }
    for (const item of items) {
        const id = item.dataset.sdId;
        item.addEventListener('pointerenter', () => { hovered = id; render(); });
        item.addEventListener('pointerleave', () => { if (hovered === id) hovered = null; render(); });
        item.addEventListener('focus', () => { focused = id; render(); });
        item.addEventListener('blur', () => { if (focused === id) focused = null; render(); });
        item.addEventListener('click', () => pin(id));
        item.addEventListener('keydown', event => {
            if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); pin(id); }
        });
    }
    document.addEventListener('keydown', event => { if (event.key === 'Escape') reset(); });
    svg.addEventListener('click', event => { if (!event.target.closest('[data-sd-id]')) reset(); });
    clear.addEventListener('click', () => {
        // Move focus off a control that is about to be hidden.
        const previous = byID.get(pinned || hovered || focused);
        previous?.focus();
        reset();
    });
    render();
})();
</script></body></html>
